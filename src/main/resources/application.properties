spring.application.name=healthbridge-backend
spring.config.import=optional:file:.env[.properties]
server.port=8088
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/health-bridge-dev}
spring.data.mongodb.database=health-bridge-dev
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/health-bridge-dev}
spring.mongodb.database=health-bridge-dev
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Google OAuth Configuration
google.client.id=${GOOGLE_CLIENT_ID:your_google_client_id.apps.googleusercontent.com}
google.client.secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret}

# Logging
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB